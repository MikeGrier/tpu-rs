name: release-please

# Creates or updates a "Release PR" on every push to main.
# When the Release PR is merged it creates the tag + GitHub Release,
# which triggers publish-extension.yml and publish-crate.yml.
#
# Commit message conventions that drive version bumps:
#   fix: ...             → patch  (0.1.3 → 0.1.4)
#   feat: ...            → minor  (0.1.3 → 0.2.0)
#   feat!: ...           → major  (0.1.3 → 1.0.0)
#   BREAKING CHANGE: ... → major  (in the commit footer)
#
# What the Release PR updates automatically:
#   - [workspace.package].version in Cargo.toml  (both Rust crates inherit
#     it via `version.workspace = true`)
#   - Cargo.lock (updated by the `sync-version-artifacts` job below)
#   - the managed `tpu setup` guidance block in
#     .github/copilot-instructions.md, whose version marker embeds
#     CARGO_PKG_VERSION (re-injected by the `sync-version-artifacts` job)
#   - version in crates/tpu-mcp/extension/package.json
#   - version in crates/tpu-mcp/extension/package-lock.json (root + packages[""])
#   - CHANGELOG.md
#
# After merging the Release PR the tag v{version} is created.
# publish-extension.yml and publish-crate.yml both trigger on `v*` tags.

on:
  push:
    branches: [main]

# Serialize all runs so the `sync-version-artifacts` job never races against a
# concurrent run trying to push to the same release-PR branch.
# `cancel-in-progress: false` lets an in-flight run finish; the next
# queued run will then see a fully up-to-date release branch.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # IMPORTANT: must be a PAT (personal access token) with `repo`
          # scope, NOT `secrets.GITHUB_TOKEN`. GitHub suppresses workflow
          # triggers for events (tags, pushes) created by GITHUB_TOKEN, so
          # the v* tag that release-please creates on merge would never start
          # publish-extension.yml or publish-crate.yml. Store a PAT as the
          # `RELEASE_PLEASE_TOKEN` repository secret to enable those flows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # After release-please creates or updates the Release PR, refresh every
  # artifact that embeds the workspace version but is not rewritten by
  # release-please itself.  Without this the Release PR's own CI fails:
  #
  #   - Cargo.lock would still reference the old workspace-member versions.
  #   - The managed `tpu setup` block in .github/copilot-instructions.md
  #     carries a `<!-- tpu-mcp:setup:version=X.Y.Z -->` marker generated from
  #     CARGO_PKG_VERSION, so a version bump alone makes it stale and trips
  #     `repo_copilot_instructions_block_matches_generated_guidance`.
  #
  # Re-injecting here is also what keeps the marker honest for humans: agents
  # are told to compare it against the running binary's `tpu_version` and stop
  # on a mismatch, so a marker left behind by a release silently erodes that
  # check.  4.0.0 shipped exactly that way.
  sync-version-artifacts:
    name: sync version-derived artifacts on release PR
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          # Use the same PAT so the committed push is associated with the
          # non-bot identity, ensuring CI triggers on the new commit.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock for version bump
        # Running without --locked lets cargo update the workspace-member
        # entries (tpu, tpu-mcp) to match the new version while preserving
        # the locked versions of all external dependencies.
        run: cargo check --workspace

      - name: Re-inject the tpu setup guidance block
        # Rebuilds the managed block from the just-bumped CARGO_PKG_VERSION so
        # its version marker matches the release being cut.
        run: cargo run -p tpu -- setup --inject .github/copilot-instructions.md

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/copilot-instructions.md
          git diff --staged --quiet || git commit -m "chore: sync version-derived artifacts for version bump"
          git push
