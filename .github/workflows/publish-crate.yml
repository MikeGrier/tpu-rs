name: publish-crate

# Publish the `tpu` crate to crates.io and attach a GitHub Release.
#
# Trigger:
#   - Pushing a tag matching `tpu-v*` (e.g. `tpu-v0.1.3`).
#   - `workflow_dispatch` for manual rehearsal (publish step still gated).
#
# Gating:
#   - The `publish` job uses `environment: crates-io`. That GitHub
#     environment must be configured (one-time, by the operator) with
#     `MikeGrier` as a required reviewer and the `CARGO_REGISTRY_TOKEN`
#     secret set to a crates.io API token scoped to "Publish new crates"
#     and "Publish updates". The publish step blocks on approval.
#
# Tag/version cross-check:
#   - The `verify` job parses the crate version from `crates/tpu/Cargo.toml`
#     and asserts it matches the pushed tag. This prevents accidentally
#     publishing the wrong version if someone forgets to bump the crate
#     before tagging.

on:
  push:
    tags:
      - "tpu-v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

# Opt every JavaScript-action step into the Node.js 24 runtime ahead of
# GitHub's June 2, 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: verify + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      - name: Cross-check tag vs. crate version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' crates/tpu/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == tpu-v* ]]; then
              tag_ver="${tag#tpu-v}"
              if [[ "$tag_ver" != "$ver" ]]; then
                  echo "::error::Tag '$tag' implies version '$tag_ver' but crates/tpu/Cargo.toml has '$ver'. Bump the crate, retag, and try again."
                  exit 1
              fi
          fi
          echo "Version check passed: $ver"

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # `crates-io` is a GitHub Actions environment with `MikeGrier` as a
    # required reviewer and `CARGO_REGISTRY_TOKEN` configured as a secret.
    # The job pauses here until a maintainer approves it in the GitHub UI.
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      - name: cargo publish -p tpu
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tpu --locked

      - name: Create GitHub Release
        # Only on tag pushes. `workflow_dispatch` runs publish to
        # crates.io but does not create a Release (no tag to attach to).
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tpu-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
