name: publish-crate

# Publish the `tpu` crate to crates.io and attach a GitHub Release.
#
# Trigger:
#   - Pushing a tag matching `v*` (e.g. `v0.1.3`); created automatically
#     by release-please when the Release PR is merged.
#   - `workflow_dispatch` for manual rehearsal: only the `verify` job
#     runs, which includes a `cargo publish --dry-run`.  The `publish`
#     job is skipped entirely on manual dispatch, so the `crates-io`
#     environment gate is never presented and no real release can occur.
#
# Gating:
#   - On tag pushes the `publish` job uses `environment: crates-io`.
#     That GitHub environment must be configured (one-time, by the
#     operator) with `MikeGrier` as a required reviewer and the
#     `CARGO_REGISTRY_TOKEN` secret set to a crates.io API token scoped
#     to "Publish new crates" and "Publish updates".  The publish step
#     blocks on approval.
#
# Tag/version cross-check:
#   - The `verify` job parses the workspace version from the root
#     `Cargo.toml` ([workspace.package].version) and asserts it matches
#     the pushed tag. This prevents accidentally publishing the wrong
#     version if a tag is pushed without a matching release-please bump.
#
# Selective publish:
#   - Because the workspace uses a single shared version, a release that
#     only touches the VS Code extension (crates/tpu-mcp/**) or workflow
#     files would otherwise force a crates.io version bump for `tpu`
#     despite no Rust API change. The `verify` job therefore diffs
#     `crates/tpu/` against the previous tag and sets `tpu_changed`.
#     The `publish` job only runs when `tpu_changed == 'true'`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

# Opt every JavaScript-action step into the Node.js 24 runtime ahead of
# GitHub's June 2, 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: verify + test
    runs-on: ubuntu-latest
    outputs:
      tpu_changed: ${{ steps.detect-changes.outputs.tpu_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags are needed by the detect-changes step to
          # compare crates/tpu/ against the previous release tag.
          fetch-depth: 0

      - name: Read workspace version
        id: workspace-version
        uses: ./.github/actions/workspace-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      - name: Cross-check tag vs. crate version
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.workspace-version.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == v* ]]; then
              tag_ver="${tag#v}"
              if [[ "$tag_ver" != "$ver" ]]; then
                  echo "::error::Tag '$tag' implies version '$tag_ver' but Cargo.toml has '$ver'. Update [workspace.package] version in the root Cargo.toml (or rerun release-please), retag, and try again."
                  exit 1
              fi
          fi
          echo "Version check passed: $ver"

      - name: Detect tpu crate changes
        id: detect-changes
        shell: bash
        run: |
          set -euo pipefail
          # Find the previous v* release tag reachable from HEAD's parent.
          # `--match 'v*'` restricts to release tags only, avoiding noise
          # from other tag patterns.  `2>/dev/null || true` handles two
          # expected failure cases:
          #   1. Initial commit: HEAD^ does not exist → git describe fails.
          #   2. No previous v* tag exists yet → git describe fails.
          # In both cases prev_tag is left empty and we fall through to the
          # "first release" branch below.
          # NOTE: `fetch-depth: 0` on the Checkout step above ensures the full
          # tag history is available, so HEAD^ and all prior tags are reachable.
          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$prev_tag" ]; then
            echo "No previous v* tag found — publishing as first release"
            echo "tpu_changed=true" >> "$GITHUB_OUTPUT"
          else
            # Source changes in crates/tpu/ (Rust code, crate Cargo.toml, tests).
            tpu_src=$(git diff --name-only "$prev_tag" HEAD -- crates/tpu/)
            # Workspace-level changes that affect the tpu crate specifically:
            #   - [workspace.package] metadata beyond the version bump
            #     (e.g. an edition or rust-version change), OR
            #   - [workspace.dependencies] entries for deps that
            #     crates/tpu/Cargo.toml declares with `workspace = true`.
            # Changes to workspace deps only used by crates/tpu-mcp/ are
            # excluded to avoid forcing a crates.io publish on extension-only
            # releases.
            #
            # Build an alternation pattern from tpu's workspace-dep names,
            # then filter the Cargo.toml diff to only relevant lines.
            # `|| true` on the grep steps prevents exit code 1 (no match)
            # from aborting the script under set -euo pipefail — no match is
            # the normal result for an extension-only release.
            tpu_ws_deps=$(grep -E '^[a-zA-Z0-9_-]+[[:space:]]*=' \
                crates/tpu/Cargo.toml \
              | grep -E 'workspace[[:space:]]*=[[:space:]]*true' \
              | grep -oE '^[a-zA-Z0-9_-]+' \
              | tr '\n' '|' | sed 's/|$//' || true)
            root_diff=$(git diff "$prev_tag" HEAD -- Cargo.toml \
              | grep '^[+-]' | grep -v '^---' | grep -v '^+++' \
              | grep -vE '^(\+|-)version[[:space:]]*=' || true)
            cargo_structural=""
            if [ -n "$root_diff" ]; then
              if [ -n "$tpu_ws_deps" ]; then
                cargo_structural=$(echo "$root_diff" \
                  | grep -E "(${tpu_ws_deps}|edition|rust-version)" || true)
              else
                cargo_structural=$(echo "$root_diff" \
                  | grep -E "(edition|rust-version)" || true)
              fi
            fi
            if [ -n "$tpu_src" ] || [ -n "$cargo_structural" ]; then
              echo "tpu crate changes detected since $prev_tag:"
              [ -n "$tpu_src" ] && echo "$tpu_src"
              [ -n "$cargo_structural" ] && echo "(Cargo.toml: relevant workspace changes)"
              echo "tpu_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No tpu-relevant changes since $prev_tag — crates.io publish will be skipped"
              echo "tpu_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check text encoding
        run: pwsh -File tools/check-encoding.ps1

      - name: cargo build --workspace --all-targets --locked
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo publish --dry-run
        # Smoke-test that the crate is publish-ready on every run
        # (tag push and manual dispatch alike). Never touches crates.io.
        run: cargo publish -p tpu --locked --dry-run

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # Only run on real tag pushes where the tpu crate itself changed.
    # workflow_dispatch never reaches this job (so the crates-io environment
    # gate is never presented on manual runs).  Extension-only releases that
    # do not touch crates/tpu/ are also skipped here to avoid publishing a
    # semver-bumped crate with no corresponding Rust API change.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.tpu_changed == 'true'
    # `crates-io` is a GitHub Actions environment with `MikeGrier` as a
    # required reviewer and `CARGO_REGISTRY_TOKEN` configured as a secret.
    # The job pauses here until a maintainer approves it in the GitHub UI.
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      - name: Check CARGO_REGISTRY_TOKEN
        # Fail fast before creating any public release artifact.
        # If the secret is missing or misnamed this surfaces the problem
        # immediately with an actionable message, before the GitHub
        # Release is created and before cargo publish is attempted.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "::error::CARGO_REGISTRY_TOKEN secret is not set on the 'crates-io' environment. Add it under Settings → Environments → crates-io → Secrets."
              exit 1
          fi

      - name: Create GitHub Release
        # Create the release after the token check passes but before
        # cargo publish. softprops/action-gh-release is idempotent
        # (updates an existing release rather than failing), so this
        # step is safe to retry. Putting it before the irreversible
        # cargo publish means a transient release-step failure can be
        # recovered by rerunning the job.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: cargo publish -p tpu
        # Publish last: cargo publish is irreversible for a given
        # version, so it runs only after all retriable steps above have
        # already succeeded.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tpu --locked
