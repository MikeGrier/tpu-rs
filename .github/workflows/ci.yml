name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  encoding:
    name: encoding sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-encoding.ps1
        shell: pwsh
        run: ./tools/check-encoding.ps1

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--frozen` (= `--locked` + `--offline`) makes CI fail if Cargo would
      # need to update Cargo.lock or hit the network for a registry refresh.
      # CI must build the exact dependency graph that was committed; any
      # version drift should happen in a developer's local edit, not silently
      # in CI.
      - name: cargo build
        run: cargo build --workspace --all-targets --frozen
      - name: cargo test
        run: cargo test --workspace --frozen
