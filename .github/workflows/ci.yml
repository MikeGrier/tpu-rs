name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel any in-progress run for the same workflow and PR/push when a newer
# commit arrives.  PR number is used on pull_request events (unique per PR,
# fork-safe — two forks can share a branch name but never the same PR number).
# On push-to-main and other non-PR events the PR number is absent, so
# github.run_id is used (unique per run → no cross-run cancellation).  This
# ensures that when the release-please `sync-version-artifacts` job pushes a
# fix commit to the Release PR branch (refreshed Cargo.lock and re-injected
# guidance block), the earlier (stale-artifact) run is cancelled and only the
# fresh run proceeds.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Opt every JavaScript-action step into the Node.js 24 runtime ahead of
# GitHub's June 2, 2026 forced cutover. Surfaces any action-vs-runtime
# incompatibilities under our control rather than discovering them on the
# day GitHub flips the default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  encoding:
    name: encoding sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run check-encoding.ps1
        shell: pwsh
        run: ./tools/check-encoding.ps1

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `--locked` makes CI fail if Cargo would need to update Cargo.lock.
      # CI must build the exact dependency graph that was committed; any
      # version drift should happen in a developer's local edit, not silently
      # in CI. (We deliberately do not use `--frozen`, which additionally
      # forbids network access and would break the initial registry fetch on
      # a cold cache.)
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      # nextest (see .config/nextest.toml) runs each test in its own process,
      # so a genuine hang is forcibly terminated (and reported as a failure)
      # per that file's slow-timeout config instead of blocking the job
      # indefinitely — bare `cargo test` has no such per-test cap. The
      # `default` profile there already sets `fail-fast = false`, matching
      # this job's prior `--no-fail-fast` policy: one failing crate must
      # never mask backtraces from other test binaries.
      - name: cargo nextest run
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
          CARGO_TERM_COLOR: always
        run: cargo nextest run --workspace --locked
      # nextest does not run doctests (nextest-rs/nextest#16); run them
      # separately. The workspace has no runnable doctests as of this
      # writing (only ```text```/```rust,ignore``` fences), so this step is
      # cheap today but guards against a future doctest silently going
      # unexercised in CI.
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --doc --workspace --locked

  build-test-windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo nextest run
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
          CARGO_TERM_COLOR: always
        run: cargo nextest run --workspace --locked
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --doc --workspace --locked

  msrv:
    name: MSRV check (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin to the exact MSRV declared in [workspace.package].rust-version
      # so a stray use of a newer-stable feature fails CI rather than
      # silently raising the floor for downstream consumers.
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --locked
