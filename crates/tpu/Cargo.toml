# Copyright (c) 2026, Michael Grier

[package]
name = "tpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Encoding-aware file I/O CLI: read, write, replace, search, and validate files with correct handling of UTF-8, UTF-16LE/BE, Windows-1252, Shift-JIS, and CRLF/LF/CR line endings."

[lib]
name = "tpu"
path = "src/lib.rs"

[[bin]]
name = "tpu"
path = "src/main.rs"

[dependencies]
harrier     = "0.1.2"
redwing     = "0.3.0"
anstream    = { workspace = true }
anstyle     = { workspace = true }
clap        = { workspace = true }
encoding_rs = "0.8"
memmap2     = "0.9"
regex       = "1"
serde       = { workspace = true }
serde_json  = { workspace = true }
tempfile    = "3"
similar = "2.7.0"
md-5 = "0.10"
crc32fast = "1"
globset = "0.4"
walkdir = "2"

[dev-dependencies]
encoding_rs = "0.8"
md-5 = "0.10"
crc32fast = "1"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
