[package]
name = "tpu-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "MCP server exposing the encoding-aware file I/O primitives of the `tpu` crate to LLM agents (Copilot Chat and other MCP clients)."

[[bin]]
name = "tpu-mcp"
path = "src/main.rs"

[dependencies]
tpu         = { path = "../tpu" }
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
tempfile = "3"
sysinfo  = { version = "0.32", default-features = false, features = ["system"] }
gix      = { version = "0.85", default-features = false, features = ["attributes", "sha1"] }
# Attribute-only decorator for `cargo mutants`, applied via
# `#[cfg_attr(test, mutants::skip)]` in worker.rs. Because the attribute is
# wrapped in `cfg_attr(test, ...)`, it is elided entirely (and `mutants::skip`
# is never resolved) whenever `cfg(test)` is false, so the crate is only ever
# needed for test builds -- a dev-dependency, not a normal one. See the doc
# comments on `IoWorker::call` in worker.rs for why specific mutants there are
# excluded from mutation testing.
mutants  = "0.0.4"
